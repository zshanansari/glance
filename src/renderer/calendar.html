<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glance</title>
    <link rel="stylesheet" href="system.css" />
    <link rel="stylesheet" href="calendar.css" />
  </head>
  <body>
    <div class="shell">
      <div
        class="popover"
        role="dialog"
        aria-modal="true"
        aria-labelledby="month-label"
      >
        <header class="header">
          <h1 id="month-label"></h1>
          <div class="nav">
            <button type="button" class="today-button" id="today-month" title="Go to today">Today</button>
            <button type="button" class="icon-button" id="prev-month" title="Previous month">
              <span class="visually-hidden">Previous month</span>
            </button>
            <button type="button" class="icon-button" id="next-month" title="Next month">
              <span class="visually-hidden">Next month</span>
            </button>
          </div>
        </header>

        <div id="live" class="visually-hidden" aria-live="polite"></div>
        <div id="grid"></div>

        <hr class="separator" />

        <section class="search quick-add" id="quick-add" aria-label="New event" hidden>
          <input
            type="text"
            id="quick-add-input"
            class="search-input"
            placeholder="Lunch with Sam tomorrow 1pm"
            aria-label="New event, in your own words"
            aria-describedby="quick-add-preview"
            autocomplete="off"
            spellcheck="false"
            maxlength="300"
          />
          <div class="quick-add-preview" id="quick-add-preview" aria-live="polite"></div>
        </section>

        <section class="search" id="search" aria-label="Search events" hidden>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Search events"
            aria-label="Search events"
            aria-controls="search-results"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="search-results" id="search-results" aria-live="polite"></div>
        </section>

        <section class="day-events" id="day-events" aria-labelledby="day-events-title">
          <div class="day-events-heading">
            <h2 id="day-events-title"></h2>
            <span id="day-events-count"></span>
          </div>
          <div class="day-events-list" id="day-events-list"></div>
        </section>

        <hr class="separator" />

        <footer class="calendar-footer tool-bar">
          <button type="button" class="icon-button" id="open-quick-add" title="New event (⌘N)" data-hint="New event" data-key="⌘N" aria-controls="quick-add" aria-expanded="false">
            <span class="visually-hidden">New event</span>
          </button>
          <button type="button" class="icon-button" id="open-search" title="Search events (⌘F)" data-hint="Search events" data-key="⌘F" aria-controls="search" aria-expanded="false">
            <span class="visually-hidden">Search events</span>
          </button>
          <span class="tool-hint" id="tool-hint" aria-hidden="true"></span>
          <button type="button" class="icon-button" id="open-settings" title="Settings (⌘,)" data-hint="Settings" data-key="⌘,">
            <span class="visually-hidden">Settings</span>
          </button>
        </footer>
      </div>
    </div>
    <script src="calendar.js"></script>
  </body>
</html>
