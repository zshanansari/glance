<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glance</title>
    <link rel="stylesheet" href="calendar.css" />
  </head>
  <body>
    <div class="shell">
      <div
        class="popover"
        role="dialog"
        aria-modal="true"
        aria-labelledby="month-label"
      >
        <header class="header">
          <h1 id="month-label"></h1>
          <div class="nav">
            <button type="button" class="today-button" id="today-month">Today</button>
            <button type="button" class="icon-button" id="prev-month">
              <span class="visually-hidden">Previous month</span>
            </button>
            <button type="button" class="icon-button" id="next-month">
              <span class="visually-hidden">Next month</span>
            </button>
          </div>
        </header>

        <div id="live" class="visually-hidden" aria-live="polite"></div>
        <div id="grid"></div>

        <hr class="separator" />

        <section class="day-events" id="day-events" aria-labelledby="day-events-title">
          <div class="day-events-heading">
            <h2 id="day-events-title"></h2>
            <span id="day-events-count"></span>
          </div>
          <div class="day-events-list" id="day-events-list"></div>
        </section>

        <hr class="separator" />

        <footer class="calendar-footer">
          <button type="button" class="menu-row" id="open-settings">
            <span>Settings…</span>
            <kbd>⌘,</kbd>
          </button>
        </footer>
      </div>
    </div>
    <script src="calendar.js"></script>
  </body>
</html>
